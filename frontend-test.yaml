apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: frontend-test
  namespace: cicd

spec:

  workspaces:

    - name: source

  steps:

    - name: npm-test

      image: node:22-alpine

      workingDir: $(workspaces.source.path)

      env:

        - name: HOME
          value: /tmp

        - name: npm_config_cache
          value: /tmp/.npm

      script: |
        #!/bin/sh

        set -e

        echo "===================================="
        echo "FRONTEND UNIT TEST"
        echo "===================================="

        cd ui

        echo "Node version:"
        node --version

        echo "NPM version:"
        npm --version

        echo "Installing dependencies..."

        npm ci --cache /tmp/.npm

        echo "Running tests..."

        npm test

        echo "Building Vue application..."

        npm run build

        echo "===================================="
        echo "FRONTEND TEST PASSED"
        echo "===================================="