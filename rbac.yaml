apiVersion: v1
kind: ServiceAccount

metadata:
  name: tekton-deployer
  namespace: cicd

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: tekton-deployer

rules:

  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: tekton-deployer

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-deployer

subjects:

  - kind: ServiceAccount
    name: tekton-deployer
    namespace: cicd