apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: backend-test
  namespace: cicd

spec:

  workspaces:
    - name: source

  steps:

    - name: go-test

      image: golang:1.27-alpine

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh

        set -e

        echo "===================================="
        echo "BACKEND UNIT TEST"
        echo "===================================="

        echo "Downloading dependencies..."

        go mod download

        echo "Running unit tests..."

        go test ./...

        echo "Running go vet..."

        go vet ./...

        echo "===================================="
        echo "BACKEND TEST PASSED"
        echo "===================================="